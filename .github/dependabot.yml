version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      # cooldown only for version updates; security updates come through
      default-days: 7
      # semver-major-days: 14 # not yet supported for GHA
    groups:
      # only group non-major changes
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions, no-changelog-update]
    commit-message:
      prefix: "ci"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    labels: [dependencies, python, no-changelog-update]
    commit-message:
      prefix: "deps"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies, nix, no-changelog-update]
    commit-message:
      prefix: "deps"
