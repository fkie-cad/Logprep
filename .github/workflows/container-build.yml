name: Reusable Container Build
on:
  workflow_call:
    inputs:
      tags:
        description: "Tags to apply to the image"
        required: true
        type: string
      release:
        description: "Whether to produce a release version without .dev suffix or not"
        required: false
        type: boolean
        default: false
      push:
        description: "Whether to push, sign and attest the image"
        required: false
        type: boolean
        default: false
jobs:
  containerbuild:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # https://github.com/docker/setup-docker-action/releases/tag/v5.7.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # https://github.com/astral-sh/setup-uv/releases/tag/v10.4.0
        with:
          version: "0.11.6"
      - name: Set up Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # https://github.com/cachix/install-nix-action/releases/tag/v31.11.3
      - name: Generate Image Tags
        id: image-tag
        env:
          TAGS: ${{ inputs.tags }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<EOF
          import os
          import re
          version = os.environ["PYTHON_VERSION"]
          # docker tags only allow [A-Za-z0-9_.-], replace other characters with "-"
          tags = [re.sub(r"[^A-Za-z0-9_.-]", "-", tag.strip()) for tag in os.environ["TAGS"].split(",")]
          full_image = [f"ghcr.io/fkie-cad/logprep:py{version}-{tag}" for tag in tags]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write(f"tags={', '.join(full_image)}")
          EOF
      - name: Set ephemeral uv version
        if: ${{ !inputs.release }}
        run: |
          # version for dev builds looks like this
          # 19.0.0.dev0+feat-abc.h31hd73
          # ^----^      ^-------^      ^
          # |           |       |------|
          # |           |       |
          # |           |       commit hash
          # |           |
          # |           branch name
          # |
          # Last release version (as of pyproject.toml)

          # replace invalid chars with "-" and collapse
          local_ref=$(printf '%s' "$GITHUB_HEAD_REF" | tr -cs 'A-Za-z0-9' '-')
          local_ref=${local_ref#-} # remove leading dash
          local_ref=${local_ref%-} # remove trailing dash
          uv version "$(uv version --short).dev0+${local_ref}.$(git rev-parse --short HEAD)"
      - name: Build Image
        run: |
          export PYTHON_VERSION="${{ matrix.python-version }}"

          nix build .#packages.x86_64-linux.docker.python${PYTHON_VERSION//.} -o image
          docker load < image
      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          # use daily updated databases from main branch
          # https://github.com/aquasecurity/trivy-action?tab=readme-ov-file#updating-caches-in-the-default-branch
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          scan-type: image
          image-ref: logprep:py${{ matrix.python-version }}
          trivy-config: trivy.yaml
      - name: Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Image
        id: push-image
        if: ${{ inputs.push }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          TAGS: ${{ steps.image-tag.outputs.tags }}
        run: |
          for tag in $(echo "$TAGS" | tr ", " "\n")
          do
            docker image tag logprep:py${PYTHON_VERSION} $tag
            docker image push $tag

            digest=$(docker inspect $tag | jq --raw-output ".[].Id")

            echo "digest=$digest" >> $GITHUB_OUTPUT
            echo "digest_no_sha=${digest#"sha256:"}" >> $GITHUB_OUTPUT
          done
      - name: Install Cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # https://github.com/sigstore/cosign-installer/releases/tag/v4.1.3
        with:
          cosign-release: "v2.6.2"
      - name: Create SBOM of container image
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # https://github.com/anchore/sbom-action/releases/tag/v0.24.3
        with:
          image: ghcr.io/fkie-cad/logprep@${{ steps.push-image.outputs.digest }}
          artifact-name: logprep@${{ steps.push-image.outputs.digest_no_sha }}.spdx.json
          output-file: logprep@${{ steps.push-image.outputs.digest_no_sha }}.spdx.json
      - name: Sign image with a key and add sbom attestation
        if: ${{ inputs.push }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ghcr.io/fkie-cad/logprep@${{ steps.push-image.outputs.digest }}
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --predicate logprep@${{ steps.push-image.outputs.digest_no_sha }}.spdx.json ghcr.io/fkie-cad/logprep@${{ steps.push-image.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
