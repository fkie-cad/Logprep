name: Main CI
# ensures that main has our basic test and code quality
on:
  push:
    branches: [main]
jobs:
  test:
    uses: ./.github/workflows/testing.yml
  code-quality:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit
    with:
      path: "**/*.py"
  helm-charts:
    # you have to update the `charts/logprep/Chart.yaml` versions to trigger a new release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # https://github.com/Azure/setup-helm/releases/tag/v5.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # https://github.com/helm/chart-releaser-action/releases/tag/v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
