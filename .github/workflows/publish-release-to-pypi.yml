name: Publish release to PyPi
on:
  release:
    types: [published]
jobs:
  build-package:
    runs-on: ubuntu-24.04
    name: Build Logprep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Set up Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # https://github.com/cachix/install-nix-action/releases/tag/v31.11.3
      - name: Build package
        run: |
          mkdir -p dist
          nix build .#dist.python311 -o dist_sl
          # hard copy contents to avoid issues with symlinks (which Nix creates by default)
          cp -rL dist_sl/* dist
      - name: Upload Artifact for next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: logprep-build
          path: dist
  publish-latest-release-to-pypi:
    runs-on: ubuntu-24.04
    name: Publish release to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/logprep
    permissions:
      id-token: write
    needs: build-package
    steps:
      - name: Download artifact from previous job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: logprep-build
          path: dist
      - name: Publish package distributions to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.3
  containerbuild:
    uses: ./.github/workflows/container-build.yml
    needs: publish-latest-release-to-pypi
    secrets: inherit
    with:
      tags: "${{ github.ref_name }}, stable, latest"
      release: true
