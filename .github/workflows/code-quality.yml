name: Code Quality
on:
  workflow_call:
    inputs:
      path:
        description: "Path to the Python files"
        required: true
        type: string
jobs:
  code-quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # https://github.com/Azure/setup-helm/releases/tag/v5.0.0
        with:
          version: "latest"
        id: install
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # https://github.com/astral-sh/setup-uv/releases/tag/v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Get changed python files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # https://github.com/tj-actions/changed-files/releases/tag/v47.0.6
        with:
          files: |
            ${{ inputs.path }}
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra doc
      - name: Check black formatting
        run: uv run black --check --diff --config ./pyproject.toml .
      - name: Lint helm charts
        run: helm lint --strict ./charts/logprep
      - name: Lint changed and added files
        if: steps.changed-files.outputs.all_changed_files
        run: uv run pylint ${{ steps.changed-files.outputs.all_changed_files }}
      - name: mypy type checking
        if: steps.changed-files.outputs.all_changed_files
        run: uv run mypy ${{ steps.changed-files.outputs.all_changed_files }}
      - name: Run tests and collect coverage
        run: uv run pytest tests/unit --cov=logprep --cov-report=xml
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
