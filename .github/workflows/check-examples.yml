name: Check Examples
on: workflow_call
jobs:
  compose-setup:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: ["logprep"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        mode: ['ng', 'legacy']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # https://github.com/docker/setup-compose-action/releases/tag/v2.4.0
        with:
          version: latest
      - name: Set up Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # https://github.com/cachix/install-nix-action/releases/tag/v31.11.3
      - name: Build images
        working-directory: examples/compose
        run: |
          # logprep version is assumed to be set in pyproject.toml
          nix build .#packages.x86_64-linux.docker.python${PYTHON_VERSION//.} -o image
          docker load < image
        env: &compose-env
          COMPOSE_PROFILES: ${{ matrix.profile }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          LOGPREP_COMMAND: ${{ matrix.mode == 'legacy' && 'logprep' || 'logprep-ng' }}
          LOGPREP_CONFIG_PATH: examples/exampledata/config/${{ matrix.mode == 'legacy' && 'pipeline.yml' || 'ng_pipeline.yml'  }}
      - name: Run Compose setup (ng)
        if: matrix.mode == 'ng'
        working-directory: examples/compose
        run: docker compose up -d
        env: *compose-env
      - name: Run Compose setup (legacy)
        if: matrix.mode == 'legacy'
        working-directory: examples/compose
        run: docker compose -f docker-compose.yml -f docker-compose.legacy-metrics.yml up -d
        env: *compose-env
      - name: Debug - show compose services
        working-directory: examples/compose
        run: docker compose ps
      - name: Send test data to kafka
        id: kafka_input
        run: |
          event_count=$(cat $EVENT_DATA_SOURCE | jq -s length)
          echo event_count=$event_count >> $GITHUB_OUTPUT
          echo "Sending $event_count events to kafka"
          (docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server 127.0.0.1:9092 --topic consumer) \
            < $EVENT_DATA_SOURCE
        env:
          EVENT_DATA_SOURCE: examples/exampledata/input_logdata/logclass/test_input.jsonl
      - name: Wait and check for processed events in logprep
        id: wait_for_logprep_processed_logs
        timeout-minutes: 1
        working-directory: examples/compose
        run: |
          docker compose logs logprep --follow | grep -i  "Stored output in opensearch" -m 1 # stop after first match
      - name: Debug - show logprep logs
        if: failure() && steps.wait_for_logprep_processed_logs.outcome == 'failure'
        working-directory: examples/compose
        run: docker compose logs logprep
      - name: Wait and check for processed events in opensearch
        id: wait_for_opensearch_index
        timeout-minutes: 2
        run: |
          while true
          do
            echo "Checking for availability of index 'processed'"
            if curl -X GET "http://localhost:9200/_list/indices" -s | grep 'processed'; then
              break
            fi
            sleep 5
          done
          sleep 5
      - name: Debug - show processed index in opensearch
        if: failure() && steps.wait_for_opensearch_index.outcome == 'failure'
        run: |
          echo "Indices:"
          curl -X GET "http://localhost:9200/_list/indices" -s
          echo "Index 'processed':"
          curl -X GET "http://localhost:9200/processed/_search" | jq
      - name: Query opensearch for events in index 'processed'
        working-directory: examples/compose
        id: opensearch_output
        timeout-minutes: 1
        run: |
          while true
          do
            # it might take multiple batches to write all the data, let's check repeatedly
            event_count=$(curl -X GET "http://localhost:9200/processed/_count" -s | jq '.count')
            if [ "${{ steps.kafka_input.outputs.event_count }}" == "$event_count" ]; then
              break
            fi
            sleep 5
          done
          echo event_count=${event_count} >> $GITHUB_OUTPUT
      - name: Check if all events were processed
        run: |
          echo "Kafka: #events = ${{ steps.kafka_input.outputs.event_count }}"
          echo "Opensearch: #events = ${{ steps.opensearch_output.outputs.event_count }}"
          if ${{ steps.kafka_input.outputs.event_count == steps.opensearch_output.outputs.event_count }} \
              && ${{ steps.kafka_input.outputs.event_count > 0 }} ; then
            echo "Sanity check successful"
            exit 0
          else
            echo "Sanity check failed"
            exit 1
          fi
      - name: Stop Compose setup (ng)
        if: always() && matrix.mode == 'ng'
        working-directory: examples/compose
        run: docker compose down
        env: *compose-env
      - name: Stop Compose setup (legacy)
        if: always() && matrix.mode == 'legacy'
        working-directory: examples/compose
        run: docker compose -f docker-compose.yml -f docker-compose.legacy-metrics.yml down
        env: *compose-env
  k8s-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHON_VERSION: "3.11"
      EVENT_DATA_SOURCE: examples/exampledata/input_logdata/logclass/test_input.jsonl
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Set up Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # https://github.com/cachix/install-nix-action/releases/tag/v31.11.3
      - name: Build logprep image
        run: |
          nix build .#packages.x86_64-linux.docker.python${PYTHON_VERSION//.} -o image
          docker load < image
          # the image values-dev.yaml expects
          docker image tag logprep:py${PYTHON_VERSION} local/logprep:latest
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # https://github.com/Azure/setup-helm/releases/tag/v5.0.1
        with:
          version: v3.22.1
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # https://github.com/helm/kind-action/releases/tag/v1.15.2
        with:
          version: v0.33.0
          cluster_name: opensiem
          wait: 120s
      - name: Load logprep image into the cluster
        run: kind load docker-image local/logprep:latest --name opensiem
      - name: Install the PodMonitor CRD
        run: kubectl apply -f https://raw.githubusercontent.com/prometheus-community/helm-charts/main/charts/kube-prometheus-stack/charts/crds/crds/crd-podmonitors.yaml
      - name: Install the opensiem example
        run: |
          helm repo add opensearch https://opensearch-project.github.io/helm-charts/
          helm dependency build examples/k8s
          # no --wait: logprep only gets ready once the post-install hook created its topics
          helm install opensiem examples/k8s --values examples/k8s/values-dev.yaml --timeout 15m
      - name: Wait for the opensiem example to be ready
        timeout-minutes: 15
        run: |
          # one workload at a time, so the log shows which one is slow or stuck
          for workload in statefulset/opensiem-kafka statefulset/opensiem-opensearch \
              deployment/opensiem-opensearch-dashboards deployment/opensiem-connector deployment/opensiem-logprep; do
            echo "::group::$workload"
            kubectl rollout status $workload --timeout 5m
            echo "::endgroup::"
          done
      - name: Send events to the connector and find them in opensearch
        timeout-minutes: 5
        run: |
          kubectl port-forward svc/opensiem-connector-http-input 9000:9000 > /dev/null &
          kubectl port-forward svc/opensiem-opensearch 9200:9200 > /dev/null &
          trap 'kill $(jobs -p)' EXIT
          until curl -s -o /dev/null http://localhost:9000 && curl -s -o /dev/null http://localhost:9200; do
            sleep 1
          done

          sent=$(jq -s length < $EVENT_DATA_SOURCE)
          echo "Sending $sent events to the connector"
          curl -sf --data-binary @$EVENT_DATA_SOURCE http://localhost:9000/lab/123/ABC/auditlog

          # connector -> kafka -> logprep -> opensearch, the output flushes at least every flush_timeout
          while true; do
            processed=$(curl -s http://localhost:9200/processed/_count | jq '.count // 0')
            echo "processed: $processed of $sent"
            [ "$processed" == "$sent" ] && break
            sleep 10
          done
          echo "All $sent events are in opensearch"
      - name: Debug - show cluster state and logs
        if: failure() || cancelled()
        run: |
          kubectl get all,pvc,jobs -o wide
          kubectl get events --sort-by=.lastTimestamp
          kubectl describe pods
          # where did the events get stuck: connector -> kafka -> logprep -> opensearch
          kafka="kubectl exec opensiem-kafka-0 -- /opt/kafka/bin"
          echo "::group::kafka topic offsets"
          $kafka/kafka-get-offsets.sh --bootstrap-server localhost:9092 || true
          echo "::endgroup::"
          echo "::group::kafka consumer groups"
          $kafka/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --all-groups || true
          echo "::endgroup::"
          echo "::group::opensearch indices"
          kubectl exec opensiem-opensearch-0 -- curl -s "localhost:9200/_cat/indices?v" || true
          echo "::endgroup::"
          for pod in $(kubectl get pods -o name); do
            echo "::group::logs $pod"
            kubectl logs $pod --all-containers --prefix --tail 200 || true
            echo "::endgroup::"
          done
