name: PR CI
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-pr-todos:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    steps:
      - name: Check for open TODOs in PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u

          if todos=$(grep -E -e "TODO: " -e "- \[\s?\]" <<< "$PR_BODY"); then
            todo_count=$(wc -l <<< "$todos")
            echo "::error::Open ${todo_count} TODO(s) in PR description:"
            echo "$todos"
            exit 1
          else
            grep_exit=$?
            if [ "$grep_exit" -eq 2 ]; then
              echo "::error::grep failed while scanning the PR description"
              exit 1
            fi
          fi

          echo "No open TODOs found."
  check-uv-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # https://github.com/astral-sh/setup-uv/releases/tag/v10.3.3
        with:
          enable-cache: true
      - name: Check lockfile is consistent with pyproject.toml
        run: uv lock --check
  enforce-changelog-update:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog-update') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Check if changes are limited to upcoming changes
        run: "! git diff origin/main --exit-code -- CHANGELOG.md"
  protect-changelog:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-history-fix') && !startsWith(github.event.pull_request.title, 'release:') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Check if changes are limited to upcoming changes
        run: |
          if git diff origin/main --exit-code -- CHANGELOG.md; then
            echo "CHANGELOD.md not changed"
            exit 0
          fi

          upcoming_changes=$(git diff -W origin/main -- CHANGELOG.md | grep "^ ## Upcoming Changes" -n | cut -d: -f1)
          last_release=$(git diff -W origin/main -- CHANGELOG.md | grep "^ ## " -n | tail -n +2 | head -n 1 | cut -d: -f1)
          # +2 to skip first line
          echo "All changes should be between $upcoming_changes and $last_release"

          # +6 to skip diff header
          git diff -W origin/main -- CHANGELOG.md | grep "^[^ ]" -n | tail -n +6 | cut -d: -f1 \
            | while read -r changed_line_nr; do
            echo -n "Checking line $changed_line_nr...";
            if [ $upcoming_changes -lt $changed_line_nr ] && [ $changed_line_nr -lt $last_release ]; then
              echo " valid";
            else
              echo " invalid";
              echo "Detected illegal changes"
              exit 1
            fi
          done
  test:
    uses: ./.github/workflows/testing.yml
  build-docs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # https://github.com/astral-sh/setup-uv/releases/tag/v10.3.3
        with:
          enable-cache: true
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get -y install pandoc
      - name: Install uv and sync deps
        run: |
          # doc build currently needs pytest --> dev as well
          uv sync --frozen --extra dev --extra doc
      - name: Build docs and fail on warnings
        run: |
          cd doc
          uv run make clean html SPHINXOPTS="--fail-on-warning"
  documentation-preview:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          script: |
            const pull_number = context.issue.number;
            const url = `https://logprep--${pull_number}.org.readthedocs.build/`;
            const placeholder = "(#readthedocs-preview)";

            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const body = pull.body ?? "";

            if (body.includes(url)) {
              core.info("Preview link already present.");
              return;
            }
            let new_body;
            if (body.includes(placeholder)) {
              new_body = body.replace(placeholder, `(${url})`);
            } else {
              // fallback for no template (CLI, bots): append as footer or plain link
              const link = `[Preview for docs](${url})`;
              new_body = body.trim() ? `${body.trimEnd()}\n\n---\n\n${link}` : link;
            }
            try {
              await github.rest.pulls.update({
                ...context.repo,
                pull_number,
                body: new_body,
              });
              core.info(`Added preview link: ${url}`);
            } catch (err) {
              // exit gracefully if permissions were not given
              if (err.status === 403) {
                core.warning(`Could not edit PR description (read-only token). Preview: ${url}`);
                return;
              }
              throw err;
            }
  code-quality:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit
    with:
      path: "**/*.py"
  containerbuild:
    uses: ./.github/workflows/container-build.yml
    secrets: inherit
    with:
      tags: "${{ github.head_ref }}"
  check-examples:
    uses: ./.github/workflows/check-examples.yml
  check-pr-ci-successful:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - check-pr-todos
      - check-uv-lockfile
      - enforce-changelog-update
      - protect-changelog
      - test
      - build-docs
      - documentation-preview
      - code-quality
      - containerbuild
      - check-examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Verify needs list covers every job in this file
        run: |
          # fail step if anything goes wrong
          set -euo pipefail

          # fkie-cad/Logprep/WORKFLOW_FILE_PATH@refs/heads/...
          workflow_ref="${{ github.workflow_ref }}"
          path="${workflow_ref#${{ github.repository }}/}"  # strip owner/repo prefix
          workflow_file_path="${path%%@*}"                  # strip @refs/... suffix
          echo "Resolved workflow file: ${workflow_file_path}"

          all_jobs=$(yq -o=json -I=0 '.jobs | keys' "$workflow_file_path")
          dep_jobs=$(echo "$NEEDS_JSON" | jq -c 'keys')

          missing=$(jq -n \
            --argjson all_jobs "$all_jobs" \
            --argjson dep_jobs "$dep_jobs" \
            --arg     own_job  "$OWN_JOB_ID" \
            ' $all_jobs - ($dep_jobs + [$own_job])'
          )

          if [ "$missing" != "[]" ]; then
            echo "Missing job(s) in \`needs\` declaration: ${missing}"
            exit 1
          fi
          echo "Check successful: relevant jobs of ${all_jobs} are included in needs ${dep_jobs}"
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          OWN_JOB_ID: ${{ github.job }}
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
