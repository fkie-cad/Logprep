name: PR CI
on:
  pull_request:
    types: [opened, synchronize]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-uv-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0
        with:
          enable-cache: true
      - name: Check lockfile is consistent with pyproject.toml
        run: uv lock --check
  enforce-changelog-update:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog-update') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
      - name: Check if changes are limited to upcoming changes
        run: "! git diff origin/main --exit-code -- CHANGELOG.md"
  protect-changelog:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-history-fix') && !startsWith(github.event.pull_request.title, 'release:') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
      - name: Check if changes are limited to upcoming changes
        run: |
          if git diff origin/main --exit-code -- CHANGELOG.md; then
            echo "CHANGELOD.md not changed"
            exit 0
          fi

          upcoming_changes=$(git diff -W origin/main -- CHANGELOG.md | grep "^ ## Upcoming Changes" -n | cut -d: -f1)
          last_release=$(git diff -W origin/main -- CHANGELOG.md | grep "^ ## " -n | tail -n +2 | head -n 1 | cut -d: -f1)
          # +2 to skip first line
          echo "All changes should be between $upcoming_changes and $last_release"

          # +6 to skip diff header
          git diff -W origin/main -- CHANGELOG.md | grep "^[^ ]" -n | tail -n +6 | cut -d: -f1 \
            | while read -r changed_line_nr; do
            echo -n "Checking line $changed_line_nr...";
            if [ $upcoming_changes -lt $changed_line_nr ] && [ $changed_line_nr -lt $last_release ]; then
              echo " valid";
            else
              echo " invalid";
              echo "Detected illegal changes"
              exit 1
            fi
          done
  test:
    uses: ./.github/workflows/testing.yml
  build-docs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0
        with:
          enable-cache: true
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get -y install pandoc
      - name: Install uv and sync deps
        run: |
          uv sync --frozen --extra doc
      - name: Build docs
        run: |
          cd doc
          uv run sphinx-apidoc -fT -o source/module_reference ../logprep
          uv run make clean html
  documentation-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@b8bba1484329bda1a3abe986df7ebc80a8950333 # https://github.com/readthedocs/actions/releases/tag/v1.5
        with:
          project-slug: logprep
          project-language: en
          platform: community
          single-version: 'true'
          message-template: "---\n<a name=\"readthedocs-preview\"></a>The rendered docs for this PR can be found [here]({docs-pr-index-url})."
  code-quality:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit
    with:
      path: "**/*.py"
  containerbuild:
    uses: ./.github/workflows/container-build.yml
    secrets: inherit
    with:
      tags: "${{ github.head_ref }}"
  check-examples:
    uses: ./.github/workflows/check-examples.yml
  check-pr-ci-successful:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - check-uv-lockfile
      - enforce-changelog-update
      - protect-changelog
      - test
      - build-docs
      - documentation-preview
      - code-quality
      - containerbuild
      - check-examples
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
      - name: Verify needs list covers every job in this file
        run: |
          # fail step if anything goes wrong
          set -euo pipefail

          # fkie-cad/Logprep/WORKFLOW_FILE_PATH@refs/heads/...
          workflow_ref="${{ github.workflow_ref }}"
          path="${workflow_ref#${{ github.repository }}/}"  # strip owner/repo prefix
          workflow_file_path="${path%%@*}"                  # strip @refs/... suffix
          echo "Resolved workflow file: ${workflow_file_path}"

          all_jobs=$(yq -o=json -I=0 '.jobs | keys' "$workflow_file_path")
          dep_jobs=$(echo "$NEEDS_JSON" | jq -c 'keys')

          missing=$(jq -n \
            --argjson all_jobs "$all_jobs" \
            --argjson dep_jobs "$dep_jobs" \
            --arg     own_job  "$OWN_JOB_ID" \
            ' $all_jobs - ($dep_jobs + [$own_job])'
          )

          if [ "$missing" != "[]" ]; then
            echo "Missing job(s) in \`needs\` declaration: ${missing}"
            exit 1
          fi
          echo "Check successful: relevant jobs of ${all_jobs} are included in needs ${dep_jobs}"
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          OWN_JOB_ID: ${{ github.job }}
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
