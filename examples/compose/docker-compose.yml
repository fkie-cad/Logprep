# The following command must be executed after each restart on linux or opensearch exits with an error
# sudo sysctl -w vm.max_map_count=262144
services:
  opensearch:
    image: registry-1.docker.io/opensearchproject/opensearch:3.9.0
    hostname: opensearch
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - node.name=opensearch # Name the node that will run in this container
      - discovery.seed_hosts=opensearch # Nodes to look for when discovering the cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM
      - "DISABLE_INSTALL_DEMO_CONFIG=true" # Prevents execution of bundled demo script which installs demo certificates and security configurations to OpenSearch
      - "DISABLE_SECURITY_PLUGIN=true" # Disables security plugin
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null" # >= yellow, includes green
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - opensearch
  dashboards:
    image: registry-1.docker.io/opensearchproject/opensearch-dashboards:3.9.0
    container_name: dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true" # disables security dashboards plugin in OpenSearch Dashboards
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    networks:
      - opensearch
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTER_SERVICE
      - KAFKA_LISTENERS=INTER_SERVICE://:9091,HOST://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTER_SERVICE://kafka:9091,HOST://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTER_SERVICE:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      # internal topics default to a replication factor of 3, which a single node cannot satisfy
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - bash
      - -c
      - |
        (sleep 15 && echo 'kafka up' &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --replication-factor 1 --partitions ${KAFKA_CONSUMER_PARTITIONS-4} --topic consumer &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --replication-factor 1 --partitions ${KAFKA_ERROR_PARTITIONS-4} --topic errors &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server 127.0.0.1:9092 --replication-factor 1 --partitions ${KAFKA_PRODUCER_PARTITIONS-4} --topic producer) &
        exec /etc/kafka/docker/run
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --topic consumer --describe"
    networks:
      - kafka
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: kafkaexporter
    profiles:
      - kafka-metrics
    command:
      - "--kafka.server=kafka:9091"
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - prometheus
  logprep:
    image: logprep:py${PYTHON_VERSION:-3.11}
    container_name: logprep
    profiles:
      - logprep
    expose:
      - 8001
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ../../examples/:/home/logprep/examples/
    entrypoint:
      - ${LOGPREP_COMMAND-logprep}
      - run
      - /home/logprep/${LOGPREP_CONFIG_PATH-examples/exampledata/config/pipeline.yml}
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ../../examples/exampledata/config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../examples/exampledata/config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - prometheus
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../examples/exampledata/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - kafka
      - prometheus
    extra_hosts:
      # enables prometheus to access the host system (eg when logprep is running locally in the terminal)
      - "host.docker.internal:192.168.223.41"
  config:
    image: nginx:latest
    container_name: config
    profiles:
      - basic_auth
    ports:
      - "8081:8081"
    volumes:
      - ../../examples/exampledata:/usr/share/nginx/html:ro
      - ../../examples/exampledata/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../examples/exampledata/config/nginx/conf.d:/etc/nginx/conf.d:ro
  mtls-config:
    image: nginx:latest
    container_name: mtls-config
    profiles:
      - mtls
    ports:
      - "8082:8082"
    volumes:
      - ../../examples/exampledata:/usr/share/nginx/html:ro
      - ../../examples/exampledata/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../examples/exampledata/config/nginx/mtls.conf.d:/etc/nginx/conf.d:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    ports:
      - "8080:8080"
    profiles:
      - oauth2
    # imports the logprep realm from data/import unless it exists already
    command: ["start-dev", "--import-realm"]
    volumes:
      - ../../examples/exampledata/config/keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - keycloak
  keycloak_db:
    image: postgres:18.6
    container_name: keycloak_db
    expose:
      - 5432
    profiles:
      - oauth2
    environment:
      POSTGRES_PASSWORD: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 8s
      timeout: 5s
      retries: 10
    volumes:
      # postgres 18 keeps its data in a versioned directory below /var/lib/postgresql
      - keycloak-db-volume:/var/lib/postgresql
    networks:
      - ucl
      - keycloak
  fda-api:
    image: registry.gitlab.com/z-e-u-s/fda/fda-backend:0.25.0
    container_name: fda-api
    profiles:
      - oauth2
    read_only: true
    environment:
      POSTGRES_HOST: fda-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: fda
      POSTGRES_USER: fda
      POSTGRES_PASSWORD: fda
      THROTTLE_RATE_ANON: 1000/day
      THROTTLE_RATE_USER: 1000/day
      WEB_CONCURRENCY: 4
      SECURE_SSL_REDIRECT: "False"
      SERVICE_BASE_URL: http://localhost:8000/api/v1
      DJANGO_SECRET_KEY: "django-insecure-*w($$5i@@iq%!ygufa%%@nfdplt(!e#hoahnjy^@6xdutl8mlqz"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      CORS_ALLOWED_ALLOW_ALL: "True"
      DJANGO_DEBUG: "True"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: logprep
      KEYCLOAK_CLIENT_ID: fda-backend
      KEYCLOAK_CLIENT_ID_FOR_AUTHZ_ROLES: fda
      KEYCLOAK_CLIENT_SECRET: tYfkKygb1g2Hf6fmAInoq3XPK1OILbSp
      KEYCLOAK_VERIFY_CERTIFICATE: "False"
      KEYCLOAK_VALIDATE_ISSUER: "False"
      SECURE_REDIRECT_EXEMPT: '[".*localhost.*"]'
    depends_on:
      fda-db:
        condition: service_healthy
    entrypoint:
      - ./docker/docker-entrypoint.sh
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - fda
      - keycloak
  fda-db:
    container_name: fda-db
    profiles:
      - oauth2
    image: "postgres:14"
    read_only: true
    volumes:
      - fda-db-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: fda
      POSTGRES_USER: fda
      POSTGRES_DB: fda
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 8s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    networks:
      - fda
  fda-frontend:
    image: registry.gitlab.com/z-e-u-s/fda/fda-frontend:0.25.0
    container_name: fda-frontend
    profiles:
      - oauth2
    depends_on:
      fda-api:
        condition: service_started
    ports:
      - "3002:80"
    volumes:
      - ../../examples/exampledata/config/fda/config.json:/usr/share/nginx/html/assets/config/keycloak/config.json
      - ../../examples/exampledata/config/fda/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fda
  ucl-api:
    image: registry.gitlab.com/z-e-u-s/ucl/ucl-backend:0.25.0
    container_name: ucl-api
    profiles:
      - oauth2
    read_only: true
    environment:
      POSTGRES_HOST: ucl-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ucl
      POSTGRES_USER: ucl
      POSTGRES_PASSWORD: ucl
      THROTTLE_RATE_ANON: 1000/day
      THROTTLE_RATE_USER: 1000/day
      WEB_CONCURRENCY: 4
      SECURE_SSL_REDIRECT: "False"
      UCL_BASE_URL: http://localhost:8000/api/v1
      DJANGO_SECRET_KEY: "django-insecure-secret_key"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost # neccessary if CORS_ORIGIN_ALLOW_ALL=FALSE
      CORS_ORIGIN_ALLOW_ALL: "True"
      DJANGO_DEBUG: "True"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: logprep
      KEYCLOAK_CLIENT_ID: ucl-backend
      KEYCLOAK_CLIENT_ID_FOR_AUTHZ_ROLES: ucl
      KEYCLOAK_CLIENT_SECRET: Zq15PsiNvXjCtBUHwG8x8NwaWjJwaB17
      KEYCLOAK_VERIFY_CERTIFICATE: "False"
      KEYCLOAK_VALIDATE_ISSUER: "False"
      # FDA_BASE_URL: http://fda-frontend
    depends_on:
      ucl-db:
        condition: service_healthy
    entrypoint:
      - ./docker/docker-entrypoint.sh
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - ucl
      - keycloak
  ucl-db:
    container_name: ucl-db
    profiles:
      - oauth2
    image: "postgres:14"
    read_only: true
    volumes:
      - ucl-db-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ucl
      POSTGRES_PASSWORD: ucl
      POSTGRES_DB: ucl
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --list"
      interval: 8s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    networks:
      - ucl
  ucl-frontend:
    image: registry.gitlab.com/z-e-u-s/ucl/ucl-frontend:0.25.0
    container_name: ucl-frontend
    profiles:
      - oauth2
    depends_on:
      ucl-api:
        condition: service_started
    ports:
      - "3001:80"
    volumes:
      - ../../examples/exampledata/config/ucl/nginx.example.conf:/etc/nginx/conf.d/default.conf
      - ../../examples/exampledata/config/ucl/general.example.json:/usr/share/nginx/html/assets/config/general/config.json
      - ../../examples/exampledata/config/ucl/keycloak.example.json:/usr/share/nginx/html/assets/config/keycloak/config.json
    networks:
      - ucl
volumes:
  opensearch-data:
  fda-db-volume:
  ucl-db-volume:
  keycloak-db-volume:
networks:
  opensearch:
    ipam:
      config:
        - subnet: 192.168.223.0/29
          gateway: 192.168.223.1
  fda:
    ipam:
      config:
        - subnet: 192.168.223.8/29
          gateway: 192.168.223.9
  ucl:
    ipam:
      config:
        - subnet: 192.168.223.16/29
          gateway: 192.168.223.17
  keycloak:
    ipam:
      config:
        - subnet: 192.168.223.24/29
          gateway: 192.168.223.25
  kafka:
    ipam:
      config:
        - subnet: 192.168.223.32/29
          gateway: 192.168.223.33
  prometheus:
    ipam:
      config:
        - subnet: 192.168.223.40/29
          gateway: 192.168.223.41
