{{- $name := printf "%s-kafka" .Release.Name }}
{{- $headless := printf "%s-headless" $name }}
{{- $kafka := .Values.kafka }}
{{- $replicas := int $kafka.replicaCount }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $headless }}
  labels:
    app.kubernetes.io/component: kafka
    {{- include "opensiem.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # the controllers have to find each other before any of them is ready
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: kafka
    {{- include "opensiem.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: kafka
    {{- include "opensiem.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: kafka
    {{- include "opensiem.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: kafka
    {{- include "opensiem.labels" . | nindent 4 }}
spec:
  serviceName: {{ $headless }}
  replicas: {{ $replicas }}
  # all controllers have to start together to form the quorum
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
      {{- include "opensiem.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka
        {{- include "opensiem.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # the image runs as appuser (1000), which has to own the volume
        fsGroup: 1000
      containers:
        - name: kafka
          image: "{{ $kafka.image.repository }}:{{ $kafka.image.tag }}"
          # the node id is the pod's ordinal, kafka-0 is node 0
          command:
            - bash
            - -c
            - export KAFKA_NODE_ID="${HOSTNAME##*-}" && exec /etc/kafka/docker/run
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://$(POD_NAME).{{ $headless }}.$(POD_NAMESPACE).svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ range $i, $node := until $replicas }}{{ if $i }},{{ end }}{{ $node }}@{{ $name }}-{{ $node }}.{{ $headless }}:9093{{ end }}
            - name: KAFKA_LOG_DIRS
              # a subdirectory, the volume root may contain lost+found
              value: /var/lib/kafka/data/logs
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # internal topics default to 3 replicas and 2 in sync, more than a smaller cluster has
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ min 3 $replicas | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: {{ min 3 $replicas | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: {{ min 2 $replicas | quote }}
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: {{ min 3 $replicas | quote }}
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: {{ min 2 $replicas | quote }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $kafka.persistence.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-provisioning
  labels:
    app.kubernetes.io/component: kafka-provisioning
    {{- include "opensiem.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provisioning
          image: "{{ $kafka.image.repository }}:{{ $kafka.image.tag }}"
          command:
            - bash
            - -c
            - |
              set -e
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ $name }}:9092 --list > /dev/null; do
                echo "waiting for kafka"
                sleep 5
              done
              {{- range $kafka.provisioning.topics }}
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ $name }}:9092 --create --if-not-exists --topic {{ .name }} --partitions {{ $kafka.provisioning.numPartitions }} --replication-factor {{ $kafka.provisioning.replicationFactor }}
              {{- end }}
