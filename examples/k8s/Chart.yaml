apiVersion: v2
name: opensiem
description: a deployment example for logprep siem deployment
type: application
version: "1.0.0"
appVersion: "1.0.0"
dependencies:
  - name: logprep
    repository: file://../../charts/logprep
    version: "*"
    alias: connector
  - name: logprep
    repository: file://../../charts/logprep
    version: "*"
  - name: opensearch
    repository: https://opensearch-project.github.io/helm-charts/
    version: "3.9.0"
  - name: opensearch-dashboards
    repository: https://opensearch-project.github.io/helm-charts/
    version: "3.9.0"
    alias: dashboards
    condition: dashboards.enabled
