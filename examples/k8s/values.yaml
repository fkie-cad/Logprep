connector:
  image:
    tag: py3.11-latest
  replicas: 1
  resources:
    limits:
      memory: "2Gi"
      cpu: "1"
    requests:
      memory: "2Gi"
      cpu: "250m"
  secrets: {}
  logger:
    level: DEBUG
  input:
    type: http_input
    message_backlog_size: 15000
    collect_meta: True
    metafield_name: "@metadata"
    uvicorn_config:
      host: 0.0.0.0
      port: 9000
      workers: 2
      access_log: true
      server_header: false
      date_header: false
    endpoints:
      /auth-json: json
      /json: json
      /lab/123/(ABC|DEF)/pl.*: plaintext
      /lab/123/ABC/auditlog: jsonl
      /health: plaintext
  output:
    type: confluentkafka_output
    topic: consumer
    flush_timeout: 300
    send_timeout: 0
    kafka_config:
      bootstrap.servers: opensiem-kafka:9092
      compression.type: gzip
      statistics.interval.ms: "60000"
kafka:
  image:
    repository: apache/kafka
    tag: 4.3.1
  replicaCount: 3
  persistence:
    size: 8Gi
  provisioning:
    replicationFactor: 3
    numPartitions: 10
    topics:
      - name: consumer
      - name: producer
      - name: errors
logprep:
  image:
    tag: py3.11-latest
  input:
    type: confluentkafka_input
    topic: consumer
    kafka_config:
      bootstrap.servers: opensiem-kafka:9092
      group.id: cgroup3
      auto.commit.interval.ms: "10000"
      queued.min.messages: "100000"
      queued.max.messages.kbytes: "65536"
      statistics.interval.ms: "60000"
    preprocessing:
      version_info_target_field: Logprep_version_info
      log_arrival_time_target_field: event.ingested
      hmac:
        target: <RAW_MSG>
        key: "thisisasecureandrandomkey"
        output_field: Full_event
  output:
    type: opensearch_output
    hosts:
      - opensiem-opensearch:9200
    default_index: processed
    default_op_type: create
    message_backlog_size: 10000
    timeout: 10000
    flush_timeout: 60
    user: admin
    secret: admin
    desired_cluster_status:
      - green
      - yellow
  error_output:
    type: confluentkafka_output
    topic: errors
    flush_timeout: 300
    send_timeout: 0
    kafka_config:
      bootstrap.servers: opensiem-kafka:9092
      compression.type: none
      statistics.interval.ms: "60000"
      queue.buffering.max.messages: "10"
      queue.buffering.max.kbytes: "1024"
      queue.buffering.max.ms: "1000"
      batch.size: "100"
      request.required.acks: "-1"
# official charts, see https://github.com/opensearch-project/helm-charts
# single node without the security plugin, plain http on opensiem-opensearch:9200
opensearch:
  # names the statefulset, masterService names the service
  fullnameOverride: opensiem-opensearch
  masterService: opensiem-opensearch
  singleNode: true
  protocol: http
  image:
    tag: 3.9.0
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
dashboards:
  enabled: true
  fullnameOverride: opensiem-opensearch-dashboards
  opensearchHosts: http://opensiem-opensearch:9200
  image:
    tag: 3.9.0
  extraEnvs:
    - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
      value: "true"
