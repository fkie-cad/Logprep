# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2
build:
  os: ubuntu-24.04
  apt_packages:
    - "pandoc"
  tools:
    python: "3.11"
sphinx:
  builder: html
  configuration: ./doc/source/conf.py
python:
  install:
    - method: uv
      command: sync
      extras:
        - dev
        - doc
